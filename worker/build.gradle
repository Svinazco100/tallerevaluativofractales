plugins {
    id 'application'
}

dependencies {
    implementation project(':common')
}

application {
    mainClass = 'co.icesi.fractal.worker.WorkerMain'
}

task runWorker(type: JavaExec) {
    mainClass = 'co.icesi.fractal.worker.WorkerMain'
    classpath = sourceSets.main.runtimeClasspath
    workingDir = rootProject.projectDir
    standardInput = System.in

    workingDir = rootProject.projectDir

}
