allprojects {
    repositories {
        mavenCentral()
    }
    layout.buildDirectory = file("C:/Users/mrtak/.gradle-builds/tallerevaluativofractales/" + project.name)
}

subprojects {
    apply plugin: 'java'

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    dependencies {
        implementation 'com.zeroc:ice:3.8.3'
    }
}
