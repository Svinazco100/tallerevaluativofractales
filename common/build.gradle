plugins {
    id 'java-library'
}

def generatedSliceDir = file("C:/Users/mrtak/.gradle-builds/tallerevaluativofractales/common/generated-src")

task compileSlice(type: Exec) {
    def sliceFile = file('src/main/slice/FractalCompute.ice')
    inputs.file sliceFile
    outputs.dir generatedSliceDir

    doFirst {
        generatedSliceDir.mkdirs()
    }

    commandLine 'C:/Users/mrtak/.gradle/native/slice-tools-3.8.3/bin/slice2java.exe',
                '--output-dir', generatedSliceDir.absolutePath,
                sliceFile.absolutePath
}

sourceSets.main.java.srcDirs += generatedSliceDir
compileJava.dependsOn compileSlice
