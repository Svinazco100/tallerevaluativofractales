plugins {
    id 'java-library'
}

task compileSlice(type: Exec) {
    def sliceFile = file('src/main/slice/FractalCompute.ice')
    def outputDir = file('src/main/java')
    inputs.file sliceFile
    outputs.dir file('src/main/java/FractalApp')
    def sliceExe = System.getenv('SLICE2JAVA') ?: (file('C:/Users/mrtak/.gradle/native/slice-tools-3.8.3/bin/slice2java.exe').exists() ? 'C:/Users/mrtak/.gradle/native/slice-tools-3.8.3/bin/slice2java.exe' : 'slice2java')
    commandLine sliceExe,
                '--output-dir', outputDir.absolutePath,
                sliceFile.absolutePath
}

sourceSets {
    main {
        java {
            exclude '**/AsyncMasterService.java'
            exclude '**/AsyncWorkerObserver.java'
        }
    }
}

compileSlice.onlyIf { !file('src/main/java/FractalApp/MasterService.java').exists() }
compileJava.dependsOn compileSlice
